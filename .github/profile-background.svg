<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated data background</title>
  <desc id="desc">A moving cyan data grid with glowing particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#082f49"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#67e8f9" stroke-opacity=".16"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1600" height="260" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="48 48" dur="8s" repeatCount="indefinite"/>
  </rect>
  <path d="M-80 190 C220 80 360 245 650 135 S1110 25 1680 150" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="3">
    <animate attributeName="stroke-dashoffset" from="0" to="-900" dur="7s" repeatCount="indefinite"/>
  </path>
  <g fill="#a5f3fc" filter="url(#glow)">
    <circle cx="220" cy="70" r="4"><animate attributeName="cy" values="70;185;70" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="205" r="3"><animate attributeName="cy" values="205;65;205" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="75" r="4"><animate attributeName="cy" values="75;190;75" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="1598" height="258" rx="18" fill="none" stroke="#67e8f9" stroke-opacity=".35"/>
</svg>
