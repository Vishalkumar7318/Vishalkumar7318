name: Auto Update Experience

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-experience:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          start = "<!-- EXPERIENCE:START -->"
          end = "<!-- EXPERIENCE:END -->"

          content = """### 💼 Experience

          * Market Research Analyst — **ASAUViA**
          * Data Analysis Intern — **Tutedude**
          * GenAI Powered Data Analytics — **Tata**
          * Data Analysis — **Google**"""

          pattern = re.escape(start) + r".*?" + re.escape(end)

          new_text, count = re.subn(
              pattern,
              start + "\n\n" + content + "\n\n" + end,
              text,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              raise SystemExit("Experience markers not found")

          path.write_text(new_text, encoding="utf-8")
          print("Experience updated.")

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-update experience"
          git push
