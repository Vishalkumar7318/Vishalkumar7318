name: Auto Update Projects

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Fetch Public Repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/users/Vishalkumar7318/repos?per_page=100&type=owner&sort=updated&direction=desc" \
            > repositories.json

      - name: Generate Project Cards
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import quote

          USERNAME = "Vishalkumar7318"
          PROFILE_REPO = "Vishalkumar7318"

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          with open("repositories.json", "r", encoding="utf-8") as f:
              repositories = json.load(f)

          repositories = [
              repo for repo in repositories
              if not repo.get("private", True)
              and not repo.get("fork", False)
              and not repo.get("archived", False)
              and repo.get("name") != PROFILE_REPO
          ]

          repositories.sort(
              key=lambda repo: repo.get("pushed_at") or "",
              reverse=True
          )

          def clean(value, fallback):
              if not value:
                  return fallback

              return (
                  str(value)
                  .replace("\n", " ")
                  .replace("\r", " ")
                  .strip()
              )

          lines = []

          for repo in repositories:
              name = clean(repo.get("name"), "Project")
              description = clean(
                  repo.get("description"),
                  "GitHub Project"
              )

              repo_url = repo.get(
                  "html_url",
                  f"https://github.com/{USERNAME}/{name}"
              )

              homepage = clean(repo.get("homepage"), "")
              language = clean(repo.get("language"), "")

              lines.append(f"### 🚀 {name}")
              lines.append("")
              lines.append(description)
              lines.append("")

              if language:
                  badge_language = quote(language)
                  lines.append(
                      f"![{language}](https://img.shields.io/badge/"
                      f"{badge_language}-111827?style=flat-square)"
                  )
                  lines.append("")

              lines.append(
                  f"[📂 Repository]({repo_url})"
              )

              if homepage:
                  lines.append(
                      f" • [🌐 Live Demo]({homepage})"
                  )

              lines.append("")
              lines.append("---")
              lines.append("")

          if not lines:
              lines = [
                  "🚀 No public projects found yet.",
                  ""
              ]

          generated = "\n".join(lines).strip()

          start = "<!-- AUTO-PROJECTS:START -->"
          end = "<!-- AUTO-PROJECTS:END -->"

          pattern = re.compile(
              re.escape(start) + r".*?" + re.escape(end),
              re.DOTALL
          )

          replacement = (
              start
              + "\n\n"
              + generated
              + "\n\n"
              + end
          )

          updated, count = pattern.subn(
              replacement,
              readme,
              count=1
          )

          if count == 0:
              raise SystemExit(
                  "AUTO-PROJECTS markers not found in README.md"
              )

          readme_path.write_text(
              updated,
              encoding="utf-8"
          )

          print(
              f"Projects found: {len(repositories)}"
          )
          PY

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto-update GitHub projects"
          git push